<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fin-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b18" />
      <stop offset="45%" stop-color="#091430" />
      <stop offset="100%" stop-color="#0b1f3d" />
    </linearGradient>
    <radialGradient id="fin-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#23d5ec" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#23d5ec" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fin-suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11192c" />
      <stop offset="100%" stop-color="#050a16" />
    </linearGradient>
    <linearGradient id="fin-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#fin-bg)" />
  <circle cx="350" cy="240" r="280" fill="#10344e" opacity="0.45" />
  <circle cx="1220" cy="820" r="320" fill="#351b63" opacity="0.35" />
  <circle cx="760" cy="460" r="400" fill="url(#fin-glow)" />

  <!-- Suit silhouette -->
  <g transform="translate(520,180)">
    <path d="M260 0 C330 0 360 100 380 180 L420 360 H100 L140 180 C160 100 190 0 260 0Z" fill="url(#fin-suit)" stroke="#0f2137" stroke-width="4" />
    <polygon points="260,40 320,200 200,200" fill="#0e223b" />
    <polygon points="260,50 285,200 235,200" fill="#1f3f5f" />
    <polygon points="260,60 275,200 245,200" fill="#0e6ba8" />
    <rect x="220" y="200" width="80" height="160" rx="20" fill="#0c1527" opacity="0.9" />
  </g>

  <!-- Hand -->
  <g transform="translate(700,580)">
    <ellipse cx="120" cy="80" rx="180" ry="70" fill="#132742" opacity="0.7" />
    <path d="M40 50 Q120 10 200 40 Q250 60 270 90 Q280 120 250 140 Q170 180 80 150 Q20 130 20 100 Q20 70 40 50Z" fill="#1f2d4b" stroke="#2d3c5a" stroke-width="4" />
  </g>

  <!-- Fintech ring -->
  <g transform="translate(675,320)">
    <circle cx="160" cy="160" r="150" fill="none" stroke="url(#fin-ring)" stroke-width="18" />
    <circle cx="160" cy="160" r="110" fill="rgba(3,10,20,0.85)" stroke="#12263f" stroke-width="6" />
    <text x="160" y="175" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="600" font-size="54" fill="#e0f2fe">FINTECH</text>
    <g fill="#dbeafe" font-family="'Poppins', sans-serif" font-size="28" font-weight="600">
      <text x="160" y="20" text-anchor="middle">$</text>
      <text x="300" y="170">€</text>
      <text x="20" y="170">₹</text>
      <text x="160" y="320" text-anchor="middle">£</text>
      <text x="60" y="70">¥</text>
      <text x="260" y="80">₿</text>
    </g>
  </g>
</svg>
