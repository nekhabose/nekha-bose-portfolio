<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0612" />
      <stop offset="50%" stop-color="#150a26" />
      <stop offset="100%" stop-color="#231038" />
    </linearGradient>
    <radialGradient id="cg-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cg-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#cg-bg)" />
  <circle cx="340" cy="250" r="300" fill="#3a1450" opacity="0.4" />
  <circle cx="1250" cy="800" r="320" fill="#4a1240" opacity="0.4" />
  <circle cx="800" cy="470" r="420" fill="url(#cg-glow)" />

  <!-- ECG line -->
  <polyline points="120,500 420,500 480,500 520,420 560,620 610,360 660,560 700,500 1480,500"
    fill="none" stroke="#f9a8d4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- heart + ring -->
  <g transform="translate(660,250)">
    <circle cx="140" cy="180" r="190" fill="none" stroke="url(#cg-ring)" stroke-width="16" />
    <circle cx="140" cy="180" r="150" fill="rgba(10,6,18,0.8)" stroke="#3a2050" stroke-width="6" />
    <path d="M140 250 C90 205 40 175 40 125 C40 95 65 75 95 75 C118 75 135 90 140 105 C145 90 162 75 185 75 C215 75 240 95 240 125 C240 175 190 205 140 250 Z" fill="url(#cg-ring)" />
  </g>

  <text x="800" y="800" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="700" font-size="64" fill="#fdeaf5">HEALTH AI</text>
  <text x="800" y="860" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="500" font-size="30" fill="#f0abcf" opacity="0.85">VOICE CARE · 94x ROI · HIPAA</text>
</svg>
