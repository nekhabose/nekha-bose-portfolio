<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04120f" />
      <stop offset="50%" stop-color="#062421" />
      <stop offset="100%" stop-color="#0a2f36" />
    </linearGradient>
    <radialGradient id="cl-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cl-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#cl-bg)" />
  <circle cx="320" cy="240" r="300" fill="#0d4a44" opacity="0.35" />
  <circle cx="1260" cy="790" r="320" fill="#0f4560" opacity="0.3" />
  <circle cx="800" cy="470" r="430" fill="url(#cl-glow)" />

  <!-- heartbeat line -->
  <path d="M220 500 H620 L680 380 L760 640 L840 300 L920 560 L980 500 H1380"
        fill="none" stroke="url(#cl-ring)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- cross / shield -->
  <g transform="translate(680,250)">
    <path d="M140 0 L280 60 V230 C280 340 210 400 140 440 C70 400 0 340 0 230 V60 Z" fill="#08312e" stroke="url(#cl-ring)" stroke-width="12" />
    <rect x="108" y="120" width="64" height="200" rx="14" fill="#5eead4" />
    <rect x="40" y="188" width="200" height="64" rx="14" fill="#5eead4" />
  </g>

  <text x="800" y="830" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="700" font-size="60" fill="#e6fffb">CLINARA HEALTHOS</text>
  <text x="800" y="890" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="500" font-size="30" fill="#7dd3c8" opacity="0.85">GOVERNED CLINICAL INTELLIGENCE</text>
</svg>
