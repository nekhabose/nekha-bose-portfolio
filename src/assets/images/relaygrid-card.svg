<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0a05" />
      <stop offset="50%" stop-color="#1c1608" />
      <stop offset="100%" stop-color="#2b2410" />
    </linearGradient>
    <radialGradient id="rg-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rg-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#rg-bg)" />
  <circle cx="320" cy="240" r="300" fill="#4a3a10" opacity="0.4" />
  <circle cx="1260" cy="790" r="320" fill="#4a2f10" opacity="0.35" />
  <circle cx="800" cy="470" r="430" fill="url(#rg-glow)" />

  <!-- grid / network nodes -->
  <g stroke="#5a4a1e" stroke-width="3" opacity="0.8">
    <line x1="400" y1="300" x2="800" y2="430" />
    <line x1="1200" y1="300" x2="800" y2="430" />
    <line x1="400" y1="620" x2="800" y2="430" />
    <line x1="1200" y1="620" x2="800" y2="430" />
    <line x1="400" y1="300" x2="400" y2="620" />
    <line x1="1200" y1="300" x2="1200" y2="620" />
  </g>
  <g fill="#fcd34d">
    <circle cx="400" cy="300" r="16" /><circle cx="1200" cy="300" r="16" />
    <circle cx="400" cy="620" r="16" /><circle cx="1200" cy="620" r="16" />
  </g>

  <!-- truck -->
  <g transform="translate(680,360)" fill="none" stroke="url(#rg-ring)" stroke-width="12" stroke-linejoin="round">
    <rect x="0" y="0" width="150" height="110" rx="8" fill="#3a2f10" />
    <path d="M150 40 H210 L250 90 V110 H150 Z" fill="#3a2f10" />
    <circle cx="55" cy="130" r="26" fill="#2b2410" />
    <circle cx="200" cy="130" r="26" fill="#2b2410" />
  </g>

  <text x="800" y="830" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="700" font-size="62" fill="#fff7e6">RELAYGRID AI</text>
  <text x="800" y="890" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="500" font-size="30" fill="#fcd34d" opacity="0.85">AI-NATIVE FREIGHT MARKETPLACE</text>
</svg>
