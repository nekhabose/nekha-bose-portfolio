  <g stroke="#1f3b52" stroke-width="3" opacity="0.7">
    <line x1="300" y1="180" x2="560" y2="430" />
    <line x1="1300" y1="220" x2="1040" y2="430" />
    <line x1="280" y1="780" x2="560" y2="560" />
