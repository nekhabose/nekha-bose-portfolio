    <path d="M85 215 L125 260 L205 165" fill="none" stroke="#34d399" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="140" cy="120" r="34" fill="none" stroke="#22d3ee" stroke-width="8" opacity="0.8" />
