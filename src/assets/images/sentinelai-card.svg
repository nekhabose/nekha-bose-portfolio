  <text x="800" y="830" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="700" font-size="64" fill="#e6fffb">IDENTITY AI</text>
  <text x="800" y="890" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="500" font-size="30" fill="#7dd3c8" opacity="0.85">RISK · SCORE · AUTO-REMEDIATE</text>
