      <stop offset="0%" stop-color="#05070f" />
      <stop offset="50%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#101a3a" />
    </linearGradient>
    <radialGradient id="sn-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sn-ring" x1="0" y1="0" x2="1" y2="1">
