  <rect width="1600" height="1000" fill="url(#sn-bg)" />
  <circle cx="330" cy="250" r="300" fill="#0f3a3a" opacity="0.35" />
  <circle cx="1250" cy="800" r="320" fill="#163a63" opacity="0.35" />
  <circle cx="800" cy="480" r="420" fill="url(#sn-glow)" />

